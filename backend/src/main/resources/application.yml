server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: verbal-test
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:verbal_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jackson:
    property-naming-strategy: SNAKE_CASE
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

app:
  cors:
    # 逗号分隔多个 origin，例：https://verbal.example.com,https://www.verbal.example.com
    # 本地开发用 * 放行所有 origin；线上务必收窄
    allowed-origins: ${ALLOWED_ORIGINS:*}

logging:
  level:
    com.verbaltest: debug
