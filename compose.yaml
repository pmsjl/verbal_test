services:
  mysql:
    image: crpi-mv50q7qrars8doxg.cn-shenzhen.personal.cr.aliyuncs.com/pmsjl/mysql:8.0
    container_name: verbal-mysql
    env_file:
      - ./mysql.env
    volumes:
      - verbal_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks:
      - verbal-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: verbal-container-backend:latest
    container_name: verbal-backend
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - verbal-net

volumes:
  verbal_mysql_data:
    name: verbal_mysql_data

networks:
  verbal-net:
    name: verbal-net
    driver: bridge
